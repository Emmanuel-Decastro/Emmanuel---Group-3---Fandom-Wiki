<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#0d1117"/><text x="40" y="44" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="24" font-weight="bold" fill="#e8eef5">Moon-Devouring Tide: the cycle, the range, and what ends it</text><text x="40" y="90" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" font-weight="bold" fill="#7fc4ff">THE LOOP</text><rect x="40" y="110" width="720" height="104" rx="9" fill="#1b2029" stroke="#6d7c8f" stroke-width="2"/><rect x="43" y="119" width="6" height="86" rx="3" fill="#7fc4ff"/><text x="60" y="135" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e8eef5">1  CAST</text><text x="60" y="156" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4">Spend 34 FP.</text><text x="60" y="172" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4">Fixed 1.8 second activation.</text><text x="60" y="188" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4">No hyper armour. A hit stops it.</text><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#6d7c8f"/></marker></defs><line x1="80.0" y1="216.0" x2="80.0" y2="227.0" stroke="#6d7c8f" stroke-width="2.2" marker-end="url(#ah)"/><rect x="40" y="232" width="720" height="104" rx="9" fill="#1b2029" stroke="#6d7c8f" stroke-width="2"/><rect x="43" y="241" width="6" height="86" rx="3" fill="#7fc4ff"/><text x="60" y="257" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e8eef5">2  CONFIRM</text><text x="60" y="278" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4">The groove down the blade glows cold white,</text><text x="60" y="294" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4">and frost flakes drift off it.</text><text x="60" y="310" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4">No glow means the buff is not on.</text><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#6d7c8f"/></marker></defs><line x1="80.0" y1="338.0" x2="80.0" y2="349.0" stroke="#6d7c8f" stroke-width="2.2" marker-end="url(#ah)"/><rect x="40" y="354" width="720" height="104" rx="9" fill="#1b2029" stroke="#6d7c8f" stroke-width="2"/><rect x="43" y="363" width="6" height="86" rx="3" fill="#7fc4ff"/><text x="60" y="379" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e8eef5">3  BUFF (45 s)</text><text x="60" y="400" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4">+55 magic attack power.</text><text x="60" y="416" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4">Frostbite buildup rises from 38 to 55.</text><text x="60" y="432" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4">The buff runs out on its own after 45 seconds.</text><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#6d7c8f"/></marker></defs><line x1="80.0" y1="460.0" x2="80.0" y2="471.0" stroke="#6d7c8f" stroke-width="2.2" marker-end="url(#ah)"/><rect x="40" y="476" width="720" height="104" rx="9" fill="#1b2029" stroke="#6d7c8f" stroke-width="2"/><rect x="43" y="485" width="6" height="86" rx="3" fill="#7fc4ff"/><text x="60" y="501" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e8eef5">4  CHARGE</text><text x="60" y="522" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4">Stand 8 to 18 metres away.</text><text x="60" y="538" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4">Hold the heavy attack button all the way.</text><text x="60" y="554" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4">A partial charge fires nothing.</text><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#6d7c8f"/></marker></defs><line x1="80.0" y1="582.0" x2="80.0" y2="593.0" stroke="#6d7c8f" stroke-width="2.2" marker-end="url(#ah)"/><rect x="40" y="598" width="720" height="104" rx="9" fill="#1b2029" stroke="#6d7c8f" stroke-width="2"/><rect x="43" y="607" width="6" height="86" rx="3" fill="#7fc4ff"/><text x="60" y="623" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e8eef5">5  RELEASE</text><text x="60" y="644" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4">One crescent wave flies straight ahead, up to 18 m.</text><text x="60" y="660" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4">Magic damage, 24 stance damage, 83 Frostbite buildup.</text><text x="60" y="676" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4">Costs stamina, not FP. One wave per charge.</text><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#6d7c8f"/></marker></defs><line x1="80.0" y1="704.0" x2="80.0" y2="715.0" stroke="#6d7c8f" stroke-width="2.2" marker-end="url(#ah)"/><rect x="40" y="720" width="720" height="104" rx="9" fill="#1b2029" stroke="#6d7c8f" stroke-width="2"/><rect x="43" y="729" width="6" height="86" rx="3" fill="#7fc4ff"/><text x="60" y="745" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e8eef5">6  WATCH AND REPEAT</text><text x="60" y="766" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4">At 5 seconds left the glow pulses.</text><text x="60" y="782" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4">Make space and cast again.</text><text x="60" y="798" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4">Stop here and you are swinging a plain greatsword.</text><path d="M 760 800 L 806 800 L 806 134 L 764 134" fill="none" stroke="#7fc4ff" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#ah)"/><text x="830" y="467" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#7fc4ff" transform="rotate(-90 830 467)" text-anchor="middle">cast again, 34 FP</text><text x="900" y="90" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" font-weight="bold" fill="#7fc4ff">THE RANGE BAND</text><rect x="900" y="110" width="460" height="164" rx="9" fill="#1b2029" stroke="#2b3441"/><rect x="920" y="132" width="151" height="26" rx="5" fill="#2a1c1c"/><rect x="1071" y="132" width="193" height="26" rx="5" fill="#14324a"/><rect x="1264" y="132" width="75" height="26" rx="5" fill="#2a1c1c"/><text x="995" y="149" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#e2918f" text-anchor="middle">too close</text><text x="1167" y="149" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#7fc4ff" text-anchor="middle">sweet spot, 8 to 18 m</text><text x="1302" y="149" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#e2918f" text-anchor="middle">out of range</text><text x="920" y="178" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4">0 m</text><text x="1071" y="178" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4">8 m</text><text x="1266" y="178" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4" text-anchor="end">18 m</text><text x="1340" y="178" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4" text-anchor="end">30 m</text><line x1="920" y1="164" x2="920" y2="168" stroke="#4a5768" stroke-width="1.5"/><line x1="1071" y1="164" x2="1071" y2="168" stroke="#4a5768" stroke-width="1.5"/><line x1="1264" y1="164" x2="1264" y2="168" stroke="#4a5768" stroke-width="1.5"/><line x1="1340" y1="164" x2="1340" y2="168" stroke="#4a5768" stroke-width="1.5"/><text x="920" y="210" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4">The wave travels in a straight line on flat ground.</text><text x="920" y="228" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4">It does not track and it does not aim up or down.</text><text x="920" y="246" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4">Lead a moving target by hand.</text><text x="900" y="296" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" font-weight="bold" fill="#7fc4ff">WHAT THE BUFF GIVES</text><text x="906" y="320" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#a6b4c4">Magic attack power</text><text x="1354" y="320" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#e8eef5" text-anchor="end">+55</text><line x1="906" y1="327" x2="1354" y2="327" stroke="#2b3441" stroke-width="1"/><text x="906" y="345" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#a6b4c4">Frostbite buildup</text><text x="1354" y="345" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#e8eef5" text-anchor="end">38 rising to 55</text><line x1="906" y1="352" x2="1354" y2="352" stroke="#2b3441" stroke-width="1"/><text x="906" y="370" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#a6b4c4">Length</text><text x="1354" y="370" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#e8eef5" text-anchor="end">45 seconds</text><line x1="906" y1="377" x2="1354" y2="377" stroke="#2b3441" stroke-width="1"/><text x="906" y="395" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#a6b4c4">Cost</text><text x="1354" y="395" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#e8eef5" text-anchor="end">34 FP</text><line x1="906" y1="402" x2="1354" y2="402" stroke="#2b3441" stroke-width="1"/><text x="906" y="420" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#a6b4c4">Activation</text><text x="1354" y="420" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#e8eef5" text-anchor="end">1.8 seconds, no hyper armour</text><line x1="906" y1="427" x2="1354" y2="427" stroke="#2b3441" stroke-width="1"/><text x="900" y="473" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e0a63c">WHAT ENDS THE BUFF EARLY</text><rect x="900" y="493" width="460" height="28" rx="6" fill="#2b2416" stroke="#e0a63c" stroke-width="1.6"/><text x="914" y="512" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#f0d9a8">Putting the weapon away</text><rect x="900" y="527" width="460" height="28" rx="6" fill="#2b2416" stroke="#e0a63c" stroke-width="1.6"/><text x="914" y="546" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#f0d9a8">Swapping to another weapon</text><rect x="900" y="561" width="460" height="28" rx="6" fill="#2b2416" stroke="#e0a63c" stroke-width="1.6"/><text x="914" y="580" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#f0d9a8">Dying</text><text x="900" y="629" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" font-weight="bold" fill="#7fc4ff">ONE WAVE, IN NUMBERS</text><text x="906" y="653" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#a6b4c4">Damage type</text><text x="1354" y="653" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#e8eef5" text-anchor="end">Magic</text><line x1="906" y1="660" x2="1354" y2="660" stroke="#2b3441" stroke-width="1"/><text x="906" y="678" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#a6b4c4">Reach</text><text x="1354" y="678" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#e8eef5" text-anchor="end">about 18 m</text><line x1="906" y1="685" x2="1354" y2="685" stroke="#2b3441" stroke-width="1"/><text x="906" y="703" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#a6b4c4">Stance damage</text><text x="1354" y="703" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#e8eef5" text-anchor="end">24</text><line x1="906" y1="710" x2="1354" y2="710" stroke="#2b3441" stroke-width="1"/><text x="906" y="728" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#a6b4c4">Frostbite buildup</text><text x="1354" y="728" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#e8eef5" text-anchor="end">83</text><line x1="906" y1="735" x2="1354" y2="735" stroke="#2b3441" stroke-width="1"/><text x="906" y="753" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#a6b4c4">Cost</text><text x="1354" y="753" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#e8eef5" text-anchor="end">stamina only, no FP</text><line x1="906" y1="760" x2="1354" y2="760" stroke="#2b3441" stroke-width="1"/><text x="906" y="792" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4">Frostbite: fill the meter and the target takes 20 percent more</text><text x="906" y="810" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4">damage for 30 seconds. Fire removes it.</text><text x="40" y="884" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4">Group 3, GE008. Proposed values. Not official Elden Ring content.</text></svg>
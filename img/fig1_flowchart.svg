<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980"><rect width="1400" height="980" fill="#0d1117"/><text x="40" y="46" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="24" font-weight="bold" fill="#e8eef5">Moon-Eater&#8217;s Hollow: how to get the Eclipse-Bringer Greatsword</text><text x="40" y="70" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#a6b4c4">Read the left column top to bottom, then the right column. Shaded boxes are the two points where the quest usually breaks.</text><rect x="40.0" y="104.0" width="610.0" height="118.0" rx="9" ry="9" fill="#1b2029" stroke="#6d7c8f" stroke-width="2"/><text x="56.0" y="130.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e8eef5">Steps 1 and 2. Serve Ranni at Ranni&amp;#8217;s Rise</text><text x="56.0" y="149.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">Three Sisters, north-west Liurnia of the Lakes.</text><text x="56.0" y="164.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">Needs Royal Knight Loretta beaten at Caria Manor.</text><text x="56.0" y="179.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">Then speak to Iji, Blaidd, and Seluvis below.</text><text x="56.0" y="194.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">You cannot leave the tower until you speak to all three.</text><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#6d7c8f"/></marker></defs><line x1="345.0" y1="224.0" x2="345.0" y2="234.0" stroke="#6d7c8f" stroke-width="2.2" marker-end="url(#ah)"/><rect x="40.0" y="238.0" width="610.0" height="118.0" rx="9" ry="9" fill="#1b2029" stroke="#6d7c8f" stroke-width="2"/><text x="56.0" y="264.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e8eef5">Step 3. Beat Starscourge Radahn</text><text x="56.0" y="283.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">Redmane Castle, Caelid. The Radahn Festival.</text><text x="56.0" y="298.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">Frees the stars and opens the way down.</text><text x="56.0" y="313.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">Hardest wall on the route. Summon help.</text><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#6d7c8f"/></marker></defs><line x1="345.0" y1="358.0" x2="345.0" y2="368.0" stroke="#6d7c8f" stroke-width="2.2" marker-end="url(#ah)"/><rect x="40.0" y="372.0" width="610.0" height="118.0" rx="9" ry="9" fill="#1b2029" stroke="#6d7c8f" stroke-width="2"/><text x="56.0" y="398.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e8eef5">Step 4. Climb down into Nokron</text><text x="56.0" y="417.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">Crash site south of Mistwood, in Limgrave.</text><text x="56.0" y="432.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">Rocks hang in the air above the hole.</text><text x="56.0" y="447.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">Work down into Nokron, Eternal City.</text><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#6d7c8f"/></marker></defs><line x1="345.0" y1="492.0" x2="345.0" y2="502.0" stroke="#6d7c8f" stroke-width="2.2" marker-end="url(#ah)"/><rect x="40.0" y="506.0" width="610.0" height="118.0" rx="9" ry="9" fill="#2b2416" stroke="#e0a63c" stroke-width="2"/><rect x="43.0" y="514.0" width="6" height="102.0" rx="3" fill="#e0a63c"/><text x="56.0" y="532.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e8eef5">Step 5. Take three Tide-Worn Scales</text><text x="56.0" y="551.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">Night&amp;#8217;s Sacred Ground, under the huge skeleton.</text><text x="56.0" y="566.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">Concept item. The real chest holds the Fingerslayer Blade.</text><text x="56.0" y="581.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">GET THE MAGIC SCORPION CHARM FROM SELUVIS FIRST.</text><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#6d7c8f"/></marker></defs><line x1="345.0" y1="626.0" x2="345.0" y2="636.0" stroke="#6d7c8f" stroke-width="2.2" marker-end="url(#ah)"/><rect x="40.0" y="640.0" width="610.0" height="118.0" rx="9" ry="9" fill="#2b2416" stroke="#e0a63c" stroke-width="2"/><rect x="43.0" y="648.0" width="6" height="102.0" rx="3" fill="#e0a63c"/><text x="56.0" y="666.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e8eef5">Step 6. Hand the Scales to Ranni</text><text x="56.0" y="685.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">Back at Ranni&amp;#8217;s Rise.</text><text x="56.0" y="700.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">Ranni gives you the Carian Inverted Statue.</text><text x="56.0" y="715.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">This ends Seluvis&amp;#8217;s quest for good.</text><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#6d7c8f"/></marker></defs><line x1="345.0" y1="760.0" x2="345.0" y2="770.0" stroke="#6d7c8f" stroke-width="2.2" marker-end="url(#ah)"/><rect x="40.0" y="774.0" width="610.0" height="118.0" rx="9" ry="9" fill="#1b2029" stroke="#6d7c8f" stroke-width="2"/><text x="56.0" y="800.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e8eef5">Step 7. Open the moon-phase seal</text><text x="56.0" y="819.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">Jump the rooftops and rocks to Renna&amp;#8217;s Rise.</text><text x="56.0" y="834.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">The seal clears only after step 6.</text><text x="56.0" y="849.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">The tower is not entered from the ground.</text><rect x="750.0" y="104.0" width="610.0" height="118.0" rx="9" ry="9" fill="#1b2029" stroke="#6d7c8f" stroke-width="2"/><text x="766.0" y="130.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e8eef5">Step 8. Waygate down, then wake the doll</text><text x="766.0" y="149.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">Top of Renna&amp;#8217;s Rise takes you to the Ainsel River Main.</text><text x="766.0" y="164.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">Pick up the Miniature Ranni doll in the water.</text><text x="766.0" y="179.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">Rest, then choose &amp;#8220;Talk to miniature Ranni&amp;#8221; three times.</text><text x="766.0" y="194.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">She then sends you after the shadow.</text><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#6d7c8f"/></marker></defs><line x1="1055.0" y1="224.0" x2="1055.0" y2="234.0" stroke="#6d7c8f" stroke-width="2.2" marker-end="url(#ah)"/><rect x="750.0" y="238.0" width="610.0" height="118.0" rx="9" ry="9" fill="#1b2029" stroke="#7fc4ff" stroke-width="2"/><text x="766.0" y="264.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e8eef5">Step 9. Defeat the Bakunawa Shade</text><text x="766.0" y="283.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">On to the Nokstella Waterfall Basin.</text><text x="766.0" y="298.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">The Moon-Eater&amp;#8217;s Hollow opens off the river.</text><text x="766.0" y="313.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">Block the opening rush, then punish the pause.</text><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#6d7c8f"/></marker></defs><line x1="1055.0" y1="358.0" x2="1055.0" y2="368.0" stroke="#6d7c8f" stroke-width="2.2" marker-end="url(#ah)"/><rect x="750.0" y="372.0" width="610.0" height="118.0" rx="9" ry="9" fill="#1b2029" stroke="#6d7c8f" stroke-width="2"/><text x="766.0" y="398.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e8eef5">Step 10. Key in, Fang out</text><text x="766.0" y="417.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">Ranni hands over the Discarded Palace Key.</text><text x="766.0" y="432.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">Raya Lucaria Grand Library, chest next to Rennala.</text><text x="766.0" y="447.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">The chest needs Rennala beaten first.</text><text x="766.0" y="462.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">Concept item. The real chest holds the Dark Moon Ring.</text><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#6d7c8f"/></marker></defs><line x1="1055.0" y1="492.0" x2="1055.0" y2="502.0" stroke="#6d7c8f" stroke-width="2.2" marker-end="url(#ah)"/><rect x="750.0" y="506.0" width="610.0" height="118.0" rx="9" ry="9" fill="#1b2029" stroke="#6d7c8f" stroke-width="2"/><text x="766.0" y="532.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e8eef5">Step 11. Cross the Lake of Rot</text><text x="766.0" y="551.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">On to the Grand Cloister and ride the stone coffin.</text><text x="766.0" y="566.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">Bring Preserving Boluses for the Scarlet Rot.</text><text x="766.0" y="581.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">You can reach the coffin without standing in the water.</text><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#6d7c8f"/></marker></defs><line x1="1055.0" y1="626.0" x2="1055.0" y2="636.0" stroke="#6d7c8f" stroke-width="2.2" marker-end="url(#ah)"/><rect x="750.0" y="640.0" width="610.0" height="118.0" rx="9" ry="9" fill="#1b2029" stroke="#6d7c8f" stroke-width="2"/><text x="766.0" y="666.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e8eef5">Step 12. Beat Astel, then pass the seal</text><text x="766.0" y="685.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">Astel, Naturalborn of the Void, waits past the coffin.</text><text x="766.0" y="700.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">The Bakunawa Fang opens the sealed exit behind it.</text><text x="766.0" y="715.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">Without the Fang the exit stays shut.</text><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#6d7c8f"/></marker></defs><line x1="1055.0" y1="760.0" x2="1055.0" y2="770.0" stroke="#6d7c8f" stroke-width="2.2" marker-end="url(#ah)"/><rect x="750.0" y="774.0" width="610.0" height="118.0" rx="9" ry="9" fill="#1b2029" stroke="#7fc4ff" stroke-width="2"/><text x="766.0" y="800.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e8eef5">Step 13. Give the Fang to Ranni</text><text x="766.0" y="819.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">Cathedral of Manus Celes, on the Moonlight Altar.</text><text x="766.0" y="834.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">Drop down the hole near the Site of Grace.</text><text x="766.0" y="849.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#a6b4c4">Place the Fang on her palm and take the sword.</text><path d="M 658.0 833.0 C 710.0 833.0, 690.0 163.0, 742.0 163.0" fill="none" stroke="#7fc4ff" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#ah)"/><text x="700.0" y="823.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#7fc4ff" text-anchor="middle">continue</text><rect x="40" y="916.0" width="1320" height="30" rx="6" fill="#151a21" stroke="#2b3441"/><rect x="56" y="930.0" width="18" height="13" rx="3" fill="#1b2029" stroke="#6d7c8f" stroke-width="2"/><text x="84" y="940.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4">what you do</text><rect x="196" y="930.0" width="18" height="13" rx="3" fill="#2b2416" stroke="#e0a63c" stroke-width="2"/><text x="224" y="940.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4">stop, or you lose the quest</text><rect x="436" y="930.0" width="18" height="13" rx="3" fill="#1b2029" stroke="#7fc4ff" stroke-width="2"/><text x="464" y="940.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4">the reward step</text><text x="620" y="940.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#a6b4c4">Group 3, GE008. Concept quest. Not official Elden Ring content.</text></svg>